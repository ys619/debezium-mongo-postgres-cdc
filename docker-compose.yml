version: '3.8'

networks:
  cdc-network:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
  zookeeper_data:
  kafka_data:

services:
  # =========================================================================
  # 1. Apache Zookeeper (Coordinator for Kafka)
  # =========================================================================
  zookeeper:
    image: debezium/zookeeper:2.5
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    volumes:
      - zookeeper_data:/zookeeper/data
    networks:
      - cdc-network

  # =========================================================================
  # 2. Apache Kafka (Message Broker for CDC events)
  # =========================================================================
  kafka:
    image: debezium/kafka:2.5
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      - ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_BROKER_ID=1
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/kafka/data
    networks:
      - cdc-network

  # =========================================================================
  # 3. Source Database: MongoDB (with Replica Set rs0 for Oplog CDC)
  # =========================================================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cdc-network

  # Automated Replica Set Initializer for MongoDB
  mongo-init:
    image: mongo:6.0
    container_name: mongo-init
    restart: "no"
    depends_on:
      - mongodb
    networks:
      - cdc-network
    command: >
      bash -c "
        echo 'Waiting for MongoDB to accept connections...'
        until mongosh --host mongodb:27017 --eval 'db.adminCommand(\"ping\")' > /dev/null 2>&1; do
          sleep 2
        done
        echo 'MongoDB is reachable. Initializing replica set rs0...'
        mongosh --host mongodb:27017 --eval '
          try {
            rs.status();
            console.log(\"Replica set rs0 already initialized.\");
          } catch (e) {
            rs.initiate({
              _id: \"rs0\",
              members: [{ _id: 0, host: \"mongodb:27017\" }]
            });
            console.log(\"Replica set rs0 initiated successfully.\");
          }
        '
        echo 'Replica set check complete.'
      "

  # =========================================================================
  # 4. Debezium Kafka Connect (Captures MongoDB Oplog events)
  # =========================================================================
  connect:
    image: debezium/connect:2.5
    container_name: connect
    restart: always
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - mongodb
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - KEY_CONVERTER_SCHEMAS_ENABLE=false
      - VALUE_CONVERTER_SCHEMAS_ENABLE=false
    networks:
      - cdc-network

  # =========================================================================
  # 5. Target Database: PostgreSQL
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=inventory_sink
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cdc-network

  # =========================================================================
  # 6. CDC Consumer & Replication Receiver (Subscribes Kafka -> Updates Postgres)
  # =========================================================================
  cdc-consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: cdc-consumer
    restart: always
    depends_on:
      - kafka
      - postgres
      - connect
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GROUP_ID=debezium-postgres-replicator
      - TOPIC_PATTERN=^cdc\.inventory\..*
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=inventory_sink
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    networks:
      - cdc-network

  # =========================================================================
  # 7. Kafka UI (Web Console for monitoring topics, messages & connectors)
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - connect
    environment:
      - KAFKA_CLUSTERS_0_NAME=debezium-cdc-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME=debezium-connect
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS=http://connect:8083
    networks:
      - cdc-network
